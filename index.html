
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talwit – Study & Wellness Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#66DCDC',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --base-font-size: 16px;
        --font-main: 'Outfit', sans-serif;
        
        /* --- SEMANTIC COLOR SYSTEM --- */
        
        /* 1. Light Theme (Default) */
        --bg-gradient-start: #e0f7fa;
        --bg-gradient-mid: #e8f5e9;
        --bg-gradient-end: #f3e5f5;
        
        --text-main: #111827;       /* Gray 900 - High Contrast */
        --text-secondary: #4b5563;  /* Gray 600 - Readable helper text */
        --text-muted: #9ca3af;      /* Gray 400 - Disabled/Placeholder */
        --text-on-primary: #ffffff;
        
        --primary: #66DCDC;
        --primary-hover: #45b7b7;
        
        --card-bg: rgba(255, 255, 255, 0.75); 
        --card-border: rgba(255, 255, 255, 0.8);
        --input-bg: rgba(255, 255, 255, 0.6);
      }

      html {
        font-size: var(--base-font-size);
        transition: font-size 0.3s ease;
      }

      body {
        font-family: var(--font-main);
        background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
        background-attachment: fixed;
        color: var(--text-main);
        transition: background 0.4s ease, color 0.4s ease, font-family 0.3s ease;
        margin: 0;
        min-height: 100vh;
      }
      
      /* RTL Font Override */
      html[dir="rtl"] body {
        --font-main: 'Tajawal', sans-serif;
      }

      /* 2. Dark Theme Overrides */
      body.dark-theme {
        --bg-gradient-start: #0f172a;
        --bg-gradient-mid: #1e293b;
        --bg-gradient-end: #020617;
        
        --text-main: #f8fafc;       /* Slate 50 */
        --text-secondary: #cbd5e1;  /* Slate 300 */
        --text-muted: #64748b;      /* Slate 500 */
        
        --card-bg: rgba(30, 41, 59, 0.85);
        --card-border: rgba(255, 255, 255, 0.15);
        --input-bg: rgba(15, 23, 42, 0.6);
      }

      /* 3. Calm Theme Overrides (Warm/Sepia) */
      body.calm-theme {
        --bg-gradient-start: #fffbf0;
        --bg-gradient-mid: #f3e5d0;
        --bg-gradient-end: #e6d5c3;
        
        --text-main: #422006;       
        --text-secondary: #78350f;  
        --text-muted: #a68a6d;      
        
        --primary: #d97706;         
           
        --card-bg: rgba(255, 253, 245, 0.85);
        --card-border: rgba(120, 53, 15, 0.15);
        --input-bg: rgba(255, 255, 255, 0.5);
      }

      /* Global Utility Classes using Variables */
      .text-main { color: var(--text-main) !important; }
      .text-secondary { color: var(--text-secondary) !important; }
      .text-muted { color: var(--text-muted) !important; }
      
      .backdrop-blur-xl {
        background-color: var(--card-bg) !important;
        border-color: var(--card-border) !important;
      }
      .backdrop-blur-md {
         background-color: var(--input-bg) !important;
         border-color: var(--card-border) !important;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary-hover);
      }
      
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",

    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "vite": "https://esm.sh/vite@^7.2.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
